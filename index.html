<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ثبت نقاط جغرافیایی</title>
    
    <!-- Leaflet CSS برای نقشه -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #03dac6;
            --error-color: #cf6679;
            --success-color: #4caf50;
        }

        body {
            font-family: Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            touch-action: manipulation;
        }

        h2 { color: var(--accent-color); margin-bottom: 10px; }

        #map {
            height: 250px;
            width: 100%;
            max-width: 500px;
            border-radius: 15px;
            margin-bottom: 15px;
            border: 2px solid #333;
            z-index: 1;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
            max-width: 500px;
            margin-bottom: 15px;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:active { opacity: 0.6; }

        .btn-capture { background-color: var(--accent-color); color: #000; grid-column: span 2; font-size: 18px; }
        .btn-export { background-color: #3700b3; color: white; }
        .btn-clear { background-color: var(--error-color); color: white; }
        .btn-mute { background-color: #555; color: white; }

        #status-panel {
            width: 100%;
            max-width: 500px;
            padding: 10px;
            background: #000;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 15px;
            min-height: 40px;
            border: 1px solid #333;
        }

        .table-container {
            width: 100%;
            max-width: 500px;
            overflow-x: auto;
            background: var(--card-bg);
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        th, td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        th { background-color: #2c2c2c; color: var(--accent-color); }

        .btn-delete { background: none; color: var(--error-color); border: none; padding: 5px; font-size: 16px; }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #777;
        }

        /* موبایل بهینه‌سازی */
        @media (max-width: 400px) {
            th, td { padding: 6px 2px; font-size: 10px; }
        }
    </style>
</head>
<body>

    <h2>ثبت موقعیت مکانی</h2>

    <div id="map"></div>

    <div id="status-panel">در انتظار عملیات...</div>

    <div class="controls">
        <button class="btn-capture" onclick="captureLocation()">📍 ثبت نقطه جدید</button>
        <button class="btn-export" onclick="exportData('csv')">📄 خروجی CSV</button>
        <button class="btn-export" onclick="exportData('txt')">📝 خروجی TXT</button>
        <button class="btn-mute" id="muteBtn" onclick="toggleMute()">🔊 صدا: روشن</button>
        <button class="btn-clear" onclick="clearAll()">🗑️ پاکسازی همه</button>
    </div>

    <div class="table-container">
        <table id="data-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>عرض (Lat)</th>
                    <th>طول (Lon)</th>
                    <th>ارتفاع</th>
                    <th>عملیات</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="footer">تهیه‌کننده: احمد نوری</div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let points = [];
        let map, marker;
        let isMuted = false;
        let audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // --- تنظیمات اولیه نقشه ---
        function initMap() {
            // شروع با مختصات ایران (تقریبی)
            map = L.map('map').setView([35.6892, 51.3890], 5);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);
        }

        // --- سیستم صدا ---
        function playSound(type) {
            if (isMuted) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'success') {
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'error') {
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else {
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            }
        }

        function toggleMute() {
            isMuted = !isMuted;
            document.getElementById('muteBtn').innerText = isMuted ? "🔇 صدا: بی‌صدا" : "🔊 صدا: روشن";
            playSound('success');
        }

        // --- مدیریت وضعیت (Status) ---
        function updateStatus(msg, color) {
            const el = document.getElementById('status-panel');
            el.innerText = msg;
            el.style.color = color || 'white';
        }

        // --- هسته اصلی: دریافت مکان ---
        function captureLocation() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            if (!navigator.geolocation) {
                updateStatus("مرورگر شما از GPS پشتیبانی نمی‌کند.", "red");
                playSound('error');
                return;
            }

            updateStatus("در حال تلاش برای دریافت موقعیت...", "#ffeb3b");

            const options = {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            };

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const { latitude, longitude, altitude } = pos.coords;
                    const alt = altitude ? altitude.toFixed(2) : "N/A";
                    
                    playSound('success');
                    updateStatus("موقعیت ثبت شد!", "#4caf50");
                    
                    addPoint(latitude, longitude, alt);
                    updateMap(latitude, longitude);
                },
                (err) => {
                    playSound('error');
                    let msg = "خطا در دریافت موقعیت.";
                    if (err.code === 1) msg = "خطا: اجازه دسترسی داده نشده (Permission Denied). تنظیمات مرورگر را چک کنید.";
                    if (err.code === 2) msg = "خطا: موقعیت در دسترس نیست.";
                    if (err.code === 3) msg = "خطا: زمان درخواست تمام شد (Timeout).";
                    updateStatus(msg, "#cf6679");
                },
                options
            );
        }

        function addPoint(lat, lon, alt) {
            const point = {
                id: Date.now(),
                lat: lat.toFixed(6),
                lon: lon.toFixed(6),
                alt: alt
            };
            points.push(point);
            renderTable();
        }

        function updateMap(lat, lon) {
            if (marker) map.removeLayer(marker);
            map.setView([lat, lon], 16);
            marker = L.marker([lat, lon]).addTo(map);
        }

        function renderTable() {
            const tbody = document.querySelector('#data-table tbody');
            tbody.innerHTML = '';
            points.forEach((p, index) => {
                const row = `<tr>
                    <td>${index + 1}</td>
                    <td>${p.lat}</td>
                    <td>${p.lon}</td>
                    <td>${p.alt}</td>
                    <td><button class="btn-delete" onclick="deletePoint(${p.id})">🗑️</button></td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        function deletePoint(id) {
            points = points.filter(p => p.id !== id);
            renderTable();
            playSound('error');
        }

        function clearAll() {
            if(confirm("آیا تمام داده‌ها پاک شوند؟")) {
                points = [];
                renderTable();
                updateStatus("همه داده‌ها پاک شدند.", "red");
                playSound('error');
            }
        }

        // --- خروجی گرفتن ---
        function exportData(format) {
            if (points.length === 0) {
                updateStatus("هیچ داده‌ای برای خروجی وجود ندارد!", "red");
                return;
            }

            let content = "";
            let filename = `gps_data_${new Date().getTime()}`;

            if (format === 'csv') {
                content = "ID,Latitude,Longitude,Altitude\n";
                points.forEach((p, i) => {
                    content += `${i+1},${p.lat},${p.lon},${p.alt}\n`;
                });
                filename += ".csv";
            } else {
                content = "گزارش نقاط جغرافیایی\n------------------\n";
                points.forEach((p, i) => {
                    content += `نقطه ${i+1}: عرض ${p.lat}, طول ${p.lon}, ارتفاع ${p.alt}\n`;
                });
                filename += ".txt";
            }

            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            playSound('success');
        }

        // شروع برنامه
        window.onload = initMap;
    </script>
</body>
</html>
