<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090d16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ماموریت تونل نسخه ۲">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<title>ماموریت تونل | نسخه دوم قهرمان</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d16;font-family:Tahoma,Arial,sans-serif;touch-action:none}
#gameWrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#090d16}
canvas{display:block;width:100vw;height:100dvh;object-fit:contain;background:#141923}
#controls{position:fixed;inset:auto 0 max(28px,env(safe-area-inset-bottom)) 0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 16px;pointer-events:none}
.cluster{display:flex;gap:10px;pointer-events:auto}
button{width:clamp(54px,11vw,82px);height:clamp(54px,11vw,82px);border:2px solid #ffffff80;border-radius:17px;background:#17263ddd;color:white;font-size:clamp(22px,5vw,35px);font-weight:bold;box-shadow:0 5px 0 #07101c;touch-action:none;user-select:none}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #07101c;background:#315078}
#fire{background:#8b2929ef}
#hint{position:fixed;left:50%;bottom:calc(max(32px,env(safe-area-inset-bottom)) + 88px);transform:translateX(-50%);color:#fff;background:#111d;border:1px solid #ffffff30;border-radius:12px;padding:7px 12px;font-size:clamp(10px,2.5vw,12px);white-space:nowrap;pointer-events:none}
#credit{position:fixed;bottom:4px;left:0;right:0;text-align:center;color:#ffdf85;font-size:clamp(12px,3vw,17px);font-weight:bold;text-shadow:0 2px 5px #000;pointer-events:none}
#sound{position:fixed;top:max(10px,env(safe-area-inset-top));left:12px;width:42px;height:42px;border-radius:12px;font-size:19px;z-index:3}\n#install{position:fixed;top:max(10px,env(safe-area-inset-top));right:12px;width:auto;height:42px;padding:0 13px;border:1px solid #ffffff70;border-radius:12px;background:#176b50;color:#fff;font: bold 13px Tahoma;z-index:4;display:none;white-space:nowrap}
@media(orientation:portrait){#hint:after{content:" • گوشی را افقی بچرخانید";color:#ffdf85}}

#v2intro{position:fixed;z-index:20;inset:0;background:radial-gradient(circle at 50% 35%,#284e70,#080d18 72%);display:flex;align-items:center;justify-content:center;padding:22px;font-family:Tahoma}
#v2intro .panel{width:min(92vw,480px);padding:28px 22px;border:1px solid #ffffff45;border-radius:24px;background:#101c2bea;box-shadow:0 24px 70px #000b;text-align:center;color:white}
#v2intro h1{font-size:clamp(25px,6vw,38px);color:#ffdc83;margin:4px 0 12px}
#v2intro p{color:#dce9f7;font-size:18px}
#v2name{width:100%;height:54px;border-radius:13px;border:2px solid #6aa8cf;background:#f7fbff;color:#162333;font: bold 21px Tahoma;text-align:center;padding:8px;margin:12px 0}
#v2start{width:100%;height:54px;border:0;border-radius:14px;background:linear-gradient(90deg,#e6a934,#ffe18b);color:#2b1b08;font:bold 20px Tahoma}
#v2volume{position:fixed;z-index:6;top:60px;left:12px;background:#101c2bee;color:white;border:1px solid #ffffff55;border-radius:12px;padding:9px 12px;display:flex;gap:8px;align-items:center;font:12px Tahoma}
#v2volume input{width:105px;accent-color:#f4c35c}
#sound{z-index:7}
</style>
</head>
<body>
<div id="gameWrap"><canvas id="c" width="960" height="540"></canvas></div>
<div id="v2intro"><div class="panel"><div style="font-size:54px">🏆🚀</div><h1>ماموریت تونل</h1><p><b>کی قهرمانه؟</b></p><input id="v2name" maxlength="22" autocomplete="nickname" placeholder="نام قهرمان را بنویسید" value=""><button id="v2start">شروع ماجراجویی قهرمان</button><p style="font-size:12px;margin-bottom:0">نامی که می‌نویسید روی صفحه بازی نمایش داده می‌شود.</p></div></div>
<div id="v2volume">🔊 صدا <input id="v2vol" type="range" min="0" max="100" value="80"><span id="v2voltxt">۸۰٪</span></div>
<button id="sound" aria-label="فعال یا قطع کردن صدا">🔊</button>
<button id="install" type="button">⬇ نصب بازی</button>
<div id="hint">حرکت: چپ و راست • دکمه قرمز: شلیک / برداشتن / تعامل</div>
<div id="controls"><div class="cluster"><button id="left" aria-label="چپ">◀</button><button id="right" aria-label="راست">▶</button></div><div class="cluster"><button id="fire" aria-label="شلیک یا تعامل">●</button></div></div>
<div id="credit">🏆 امیر علی قهرمان 🏆</div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),W=960,H=540,FLOOR=430,END=7350;
let player,ammo,shots,enemies,pickups,camera,lightsOn,state,frame,bits,toast='',toastTimer=0,audio=null,soundOn=true,partyTimer=0,heroName='قهرمان',audioVolume=.8,birthdayStarted=0,birthdayInterval=null;
const held={left:false,right:false},clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),sx=x=>x-camera;
function audioReady(){if(!audio){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audio=new AC()}if(audio&&audio.state==='suspended')audio.resume()}
function tone(freq,duration=.12,wave='square',volume=.045,delay=0){if(!soundOn)return;audioReady();if(!audio)return;const t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();o.type=wave;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(volume*audioVolume,t);g.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+duration)}
function sfx(kind){if(kind==='shoot'){tone(150,.09,'sawtooth',.06);tone(75,.12,'triangle',.04,.025)}if(kind==='hit'){tone(520,.08,'square',.035);tone(260,.13,'triangle',.04,.07)}if(kind==='pickup'){tone(660,.09,'sine');tone(880,.13,'sine',.04,.1)}if(kind==='power'){tone(300,.12,'square');tone(500,.16,'square',.04,.12);tone(760,.2,'sine',.04,.24)}if(kind==='door'){tone(180,.25,'triangle');tone(360,.3,'sine',.05,.18)}if(kind==='lose'){tone(300,.25,'sawtooth');tone(210,.4,'sawtooth',.04,.28)}}
function birthday(){audioReady();if(!audio)return;if(birthdayInterval)clearInterval(birthdayInterval);birthdayStarted=Date.now();const notes=[392,392,440,392,523,494,392,392,440,392,587,523,392,392,784,659,523,494,440,698,698,659,523,587,523];const lens=[.28,.28,.55,.55,.55,1,.28,.28,.55,.55,.55,1,.28,.28,.55,.55,.55,.55,1,.28,.28,.55,.55,.55,1];const playPhrase=()=>{if(Date.now()-birthdayStarted>=300000){clearInterval(birthdayInterval);birthdayInterval=null;return}let t=.12;notes.forEach((n,i)=>{tone(n,lens[i]*.9,'sine',.12,t);tone(n/2,lens[i]*.8,'triangle',.045,t);if(i%3===0)tone(130,.09,'triangle',.025,t);t+=lens[i]})};playPhrase();birthdayInterval=setInterval(playPhrase,12500);}
function say(s){toast=s;toastTimer=100}
function reset(){player={x:115,walk:0,face:1};ammo=0;shots=[];camera=0;lightsOn=true;state='play';frame=0;bits=[];toast='';toastTimer=0;partyTimer=0;
pickups=[245,850,1780,1900,3350,3500,4240,4650,5180,6050].map(x=>({x,taken:false}));
enemies=[];const add=(x,type)=>enemies.push({x,type,hp:type==='fluff'?3:type==='gift'?999:2,active:false,retreat:false,phase:Math.random()*6,done:false});
[[1110,'green'],[1510,'green'],[2110,'green'],[2200,'green'],[2590,'fluff'],[3060,'blue'],[3820,'green'],[3890,'fluff'],[4200,'fluff'],[4870,'gift'],[5480,'fluff'],[5550,'gift'],[5850,'gift'],[6410,'green'],[6900,'blue']].forEach(v=>add(...v));}
function rounded(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function tunnel(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,lightsOn?'#303a45':'#02040a');g.addColorStop(.7,lightsOn?'#1c2933':'#03050a');g.addColorStop(1,'#111923');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
for(let x=-(camera%220);x<W;x+=220){ctx.fillStyle=lightsOn?'#3c4851':'#080c12';ctx.fillRect(x,105,4,300);ctx.strokeStyle=lightsOn?'#53616a':'#111722';ctx.lineWidth=3;ctx.strokeRect(x+12,150,185,210);ctx.fillStyle=lightsOn?'#26343d':'#05080d';ctx.fillRect(x+18,158,173,194)}
ctx.fillStyle=lightsOn?'#56616a':'#080b11';ctx.fillRect(0,70,W,35);ctx.fillStyle=lightsOn?'#4c555c':'#10141b';ctx.fillRect(0,FLOOR+8,W,H-FLOOR);ctx.fillStyle=lightsOn?'#788087':'#222832';ctx.fillRect(0,FLOOR+8,W,5);
for(let x=-(camera%90);x<W;x+=90){ctx.fillStyle=lightsOn?'#65717a':'#171d25';ctx.fillRect(x,FLOOR+38,48,3)}
for(let x=-(camera%300)+30;x<W;x+=300){rounded(x,104,65,12,5,lightsOn?'#dce9c7':'#242a32');if(lightsOn){ctx.fillStyle='#fff4bd';ctx.globalAlpha=.13;ctx.beginPath();ctx.moveTo(x-65,116);ctx.lineTo(x+130,116);ctx.lineTo(x+190,430);ctx.lineTo(x-120,430);ctx.fill();ctx.globalAlpha=1}}
if(!lightsOn){const px=sx(player.x)+20,g=ctx.createRadialGradient(px,FLOOR-45,24,px,FLOOR-45,225);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.48,'rgba(0,0,0,.18)');g.addColorStop(1,'rgba(0,0,0,.99)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}}
function soldier(){const x=sx(player.x);ctx.save();ctx.translate(x,FLOOR);ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(18,5,30,7,0,0,7);ctx.fill();ctx.strokeStyle='#202b2c';ctx.lineWidth=11;ctx.lineCap='round';let sw=Math.sin(player.walk)*5;ctx.beginPath();ctx.moveTo(10,-28);ctx.lineTo(5+sw,-3);ctx.moveTo(27,-28);ctx.lineTo(30-sw,-3);ctx.stroke();rounded(0,-70,36,45,8,'#415d45');rounded(3,-65,29,13,4,'#657d50');ctx.fillStyle='#c99570';ctx.beginPath();ctx.arc(19,-82,13,0,7);ctx.fill();rounded(4,-99,30,12,6,'#344c38');rounded(1,-91,35,5,2,'#263b2c');ctx.strokeStyle='#c99570';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(27,-59);ctx.lineTo(42,-48);ctx.stroke();ctx.fillStyle='#22282a';ctx.fillRect(29,-55,45,7);ctx.fillRect(67,-58,8,4);ctx.restore()}
function slime(x,color,scale=1){ctx.save();ctx.translate(sx(x),FLOOR);ctx.scale(scale,scale);ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(-24,0);ctx.quadraticCurveTo(-27,-27,-9,-34);ctx.quadraticCurveTo(0,-43,12,-32);ctx.quadraticCurveTo(29,-22,24,0);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-8,-22,4,0,7);ctx.arc(9,-22,4,0,7);ctx.fill();ctx.fillStyle='#15202a';ctx.beginPath();ctx.arc(-7,-22,2,0,7);ctx.arc(10,-22,2,0,7);ctx.fill();ctx.restore()}
function fluff(e){let bounce=Math.abs(Math.sin(frame*.075+e.phase))**1.7*76;ctx.save();ctx.translate(sx(e.x),FLOOR-bounce);ctx.fillStyle='#e9edf0';ctx.beginPath();ctx.arc(0,-22,22,0,7);ctx.arc(-15,-18,12,0,7);ctx.arc(15,-17,13,0,7);ctx.arc(0,-40,13,0,7);ctx.fill();ctx.fillStyle='#343b45';ctx.beginPath();ctx.arc(-7,-25,3,0,7);ctx.arc(8,-25,3,0,7);ctx.fill();ctx.restore()}
function gift(e){let x=sx(e.x);ctx.save();ctx.translate(x,FLOOR-23);rounded(-19,-38,38,34,5,'#e9bd28');ctx.fillStyle='#d94c3e';ctx.fillRect(-4,-38,8,34);ctx.fillRect(-19,-25,38,6);ctx.fillStyle='#d94c3e';ctx.beginPath();ctx.ellipse(-5,-42,8,5,-.5,0,7);ctx.ellipse(6,-42,8,5,.5,0,7);ctx.fill();ctx.restore()}
function drawWorld(){tunnel();for(const p of pickups)if(!p.taken&&(lightsOn||Math.abs(p.x-player.x)<190)){let x=sx(p.x);rounded(x-17,FLOOR-20,34,20,4,'#9b7135');ctx.fillStyle='#e2bd65';ctx.fillRect(x-13,FLOOR-36,26,4)}
let ex=sx(4520);if(ex>-100&&ex<W+100){rounded(ex-25,210,50,85,5,'#59636b');rounded(ex-19,216,38,72,3,'#303a42');ctx.fillStyle=lightsOn?'#43d36b':'#d73a35';ctx.beginPath();ctx.arc(ex,278,7,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='12px Tahoma';ctx.textAlign='center';ctx.fillText('برق',ex,205)}
let dx=sx(7160);rounded(dx-38,210,76,220,5,'#53351f');ctx.strokeStyle='#9b6b3e';ctx.lineWidth=5;ctx.strokeRect(dx-31,218,62,205);
for(const e of enemies){if(e.done)continue;if(e.type==='green')slime(e.x,'#49b65b',2);if(e.type==='blue')slime(e.x,'#398fe2',2);if(e.type==='fluff')fluff(e);if(e.type==='gift')gift(e)}
ctx.fillStyle='#ffe38a';for(const b of shots)ctx.fillRect(sx(b.x),b.y,18,4);soldier();rounded(18,16,180,48,12,'#111b');ctx.fillStyle='#fff';ctx.font='bold 25px Tahoma';ctx.textAlign='left';ctx.fillText(String(ammo),72,49);ctx.fillStyle='#e7c66e';ctx.fillRect(34,33,25,8);
if(toastTimer>0){rounded(300,18,360,42,12,'#101a');ctx.fillStyle='#fff';ctx.font='18px Tahoma';ctx.textAlign='center';ctx.fillText(toast,480,45)}
if(state==='lost'){ctx.fillStyle='#000b';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 42px Tahoma';ctx.fillText('ماموریت ناموفق شد',480,245);ctx.font='22px Tahoma';ctx.fillText('برای شروع دوباره صفحه را لمس کنید',480,295)}}
function partySlime(x,y,color){let bob=Math.sin(frame*.09+x*.03)*5;ctx.save();ctx.translate(x,y+bob);ctx.scale(1.35,1.35);ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(-22,0);ctx.quadraticCurveTo(-29,-29,-12,-38);ctx.quadraticCurveTo(0,-48,13,-37);ctx.quadraticCurveTo(29,-27,22,0);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-8,-26,5,0,7);ctx.arc(8,-26,5,0,7);ctx.fill();ctx.restore()}
function partyDraw(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#302050');g.addColorStop(1,'#8c4279');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<12;i++){let x=35+i*82;ctx.strokeStyle='#f7d5a0';ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+25,75);ctx.stroke();ctx.fillStyle=['#ff5c8a','#ffd34e','#62d8dc','#9be16b'][i%4];ctx.beginPath();ctx.arc(x+25,72,13,0,7);ctx.fill()}for(let i=0;i<9;i++){let x=45+i*110,y=160+(i%3)*28;ctx.fillStyle=['#ff5c8a','#ffd34e','#62d8dc','#9be16b'][i%4];ctx.beginPath();ctx.ellipse(x,y,17,23,0,0,7);ctx.fill()}
for(let i=0;i<3;i++)partySlime(110+i*105,425,'#49b65b');for(let i=0;i<3;i++)partySlime(490+i*90,425,'#398fe2');for(let i=0;i<4;i++){ctx.fillStyle='#f4f5f7';ctx.beginPath();ctx.arc(300+i*75,455,18,0,7);ctx.fill()}
ctx.save();ctx.translate(480,430);rounded(-18,-70,36,48,7,'#415d45');ctx.fillStyle='#c99570';ctx.beginPath();ctx.arc(0,-82,13,0,7);ctx.fill();rounded(-17,-99,34,11,5,'#344c38');ctx.restore();
rounded(125,330,80,50,8,'#f2b6ca');rounded(118,320,94,17,6,'#fff0d5');ctx.fillStyle='#ffcf45';for(let i=0;i<4;i++){ctx.fillRect(135+i*19,300,4,19);ctx.beginPath();ctx.arc(137+i*19,297,4,0,7);ctx.fill()}
for(const p of bits){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-4,-7,8,14);ctx.restore()}
ctx.textAlign='center';ctx.shadowColor='#2b123e';ctx.shadowBlur=12;ctx.fillStyle='#ffe18a';ctx.font='bold 44px Tahoma';ctx.fillText('تولدت مبارک '+heroName+' ❤️',480,115);ctx.fillStyle='#fff';ctx.font='bold 25px Tahoma';ctx.fillText('ماموریت تمام شد...',480,160);ctx.shadowBlur=0}
function shoot(){if(state!=='play')return;audioReady();let p=pickups.find(p=>!p.taken&&Math.abs(p.x-player.x)<48);if(p){p.taken=true;ammo+=5;if(p.x===245)lightsOn=false;sfx('pickup');say('+۵ تیر');return}if(Math.abs(4520-player.x)<75){lightsOn=true;sfx('power');say('برق وصل شد!');return}if(Math.abs(7160-player.x)<75){state='party';sfx('door');birthday();for(let i=0;i<120;i++)bits.push({x:Math.random()*W,y:Math.random()*H-H,r:Math.random()*6,c:['#ff5c8a','#ffd34e','#62d8dc','#9be16b','#fff'][i%5],v:1+Math.random()*3});partyTimer=0;return}if(ammo<=0){say('مهماتی باقی نمانده');return}ammo--;shots.push({x:player.x+65,y:FLOOR-53});sfx('shoot')}
function update(){frame++;if(toastTimer>0)toastTimer--;if(state==='party'){partyTimer++;for(const p of bits){p.y+=p.v;p.x+=Math.sin(frame*.02+p.r)*.5;if(p.y>H+10){p.y=-10;p.x=Math.random()*W}}return}if(state!=='play')return;if(held.left!==held.right){let dir=held.left?-1:1;player.x=clamp(player.x+dir*4.2,80,END-100);player.walk+=.16;player.face=dir}camera=clamp(player.x-300,0,END-W);
for(const e of enemies){if(e.done)continue;if(e.type==='blue'&&!e.active){if(player.x>e.x-370)e.active=true;else continue}if(e.type==='gift'){e.x-=1.05;if(e.x<player.x-120)e.done=true;continue}if(e.retreat){e.x+=5.4;if(e.x>player.x+650)e.done=true;continue}if(player.x>e.x-650)e.active=true;if(e.active){e.x-=e.type==='green'||e.type==='blue'?.62:.9;if(Math.abs(e.x-player.x)<(e.type==='green'||e.type==='blue'?55:34)){state='lost';sfx('lose');return}}}
for(const b of shots){b.x+=12;for(const e of enemies){if(e.done||e.retreat)continue;if(e.type==='gift'){if(Math.abs(b.x-e.x)<25&&Math.abs(b.y-(FLOOR-42))<34){ammo=Math.max(0,ammo-1);b.x=99999;say('کادو یک تیر جریمه داشت!');sfx('hit');break}continue}let ey=e.type==='fluff'?(FLOOR-Math.abs(Math.sin(frame*.075+e.phase))**1.7*76-25):(FLOOR-43);if(Math.abs(b.x-e.x)<(e.type==='green'||e.type==='blue'?52:30)&&Math.abs(b.y-ey)<48){e.hp--;b.x=99999;sfx('hit');if(e.hp<=0){e.retreat=true;say('دشمن فرار کرد!')}break}}}shots=shots.filter(b=>b.x<player.x+850&&b.x<END+100)}
function draw(){ctx.clearRect(0,0,W,H);if(state==='party')partyDraw();else drawWorld()}
function bindHold(id,key){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();audioReady();held[key]=true;try{el.setPointerCapture(e.pointerId)}catch(_){}});const up=e=>{e.preventDefault();held[key]=false};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',()=>held[key]=false)}
document.getElementById('v2start').addEventListener('click',()=>{const n=document.getElementById('v2name').value.trim();heroName=n||'قهرمان';document.getElementById('v2intro').style.display='none';document.getElementById('credit').textContent='🏆 '+heroName+' قهرمان 🏆';audioReady()});document.getElementById('v2name').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('v2start').click()});document.getElementById('v2vol').addEventListener('input',e=>{audioVolume=Number(e.target.value)/100;document.getElementById('v2voltxt').textContent=e.target.value+'٪'});bindHold('left','left');bindHold('right','right');document.getElementById('fire').addEventListener('pointerdown',e=>{e.preventDefault();shoot()});canvas.addEventListener('pointerdown',()=>{audioReady();if(state==='lost')reset()});document.getElementById('sound').onclick=()=>{soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'🔊':'🔇';if(soundOn)audioReady()};
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='4'){held.left=true;e.preventDefault()}if(e.key==='ArrowRight'||e.key==='6'){held.right=true;e.preventDefault()}if(e.key===' '||e.key==='Enter'){shoot();e.preventDefault()}});window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='4')held.left=false;if(e.key==='ArrowRight'||e.key==='6')held.right=false});window.addEventListener('blur',()=>{held.left=held.right=false});
let installPrompt=null;const installBtn=document.getElementById('install');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;installBtn.style.display='block'});
installBtn.addEventListener('click',async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;installBtn.style.display='none'}else{say('از منوی مرورگر: افزودن به صفحه اصلی');}});
window.addEventListener('appinstalled',()=>{installBtn.style.display='none';say('بازی به صفحه اصلی اضافه شد')});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}))}
function loop(){update();draw();requestAnimationFrame(loop)}reset();loop();
})();</script>
