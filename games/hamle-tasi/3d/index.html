<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>حمله تاسی سه‌بعدی</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050b18;color:#eaf7ff;font-family:Tahoma,Arial}#scene{position:fixed;inset:0}canvas{display:block}#top{position:fixed;top:env(safe-area-inset-top,8px);left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none} .pill{background:#071b31dc;border:1px solid #3bd6ff88;border-radius:14px;padding:9px 12px;font-size:13px;box-shadow:0 0 18px #00bfff22}#panel{position:fixed;bottom:env(safe-area-inset-bottom,8px);left:10px;right:10px;background:linear-gradient(145deg,#0b2543ee,#071326f2);border:1px solid #46d9ff99;border-radius:20px;padding:12px;box-shadow:0 0 28px #00bfff22}#message{text-align:center;min-height:24px;font-size:13px;color:#bdeeff;margin-bottom:6px}#subtitle{background:#06101f;border:1px solid #b18b5666;border-radius:11px;padding:8px 10px;text-align:center;color:#f0dfbd;font-size:12px;line-height:1.8;min-height:42px;margin-bottom:9px}#hand{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}.unit{background:#12375b;border:1px solid #54cfff88;border-radius:12px;color:white;padding:9px 11px;font-size:12px}.unit.active{background:#126c91;outline:2px solid #8ff3ff}#actions{display:flex;gap:8px}button{flex:1;border:1px solid #55dcff;border-radius:12px;padding:12px 8px;background:linear-gradient(120deg,#14618c,#103a69);color:white;font-weight:bold;font-size:14px}button:disabled{opacity:.35}#hint{text-align:center;font-size:10px;color:#7fa9c5;margin-top:8px}
</style></head><body><div id="scene"></div><div id="top"><div class="pill">حمله تاسی · میدان سه‌بعدی</div><div class="pill" id="turn">نوبت شما</div><div class="pill" id="score">۰ - ۰</div></div><section id="panel"><div id="message">یک نیرو انتخاب کنید، تاس بیندازید و خانه‌ای از میدان را لمس کنید.</div><div id="subtitle" aria-live="polite">راهنما: هر شخصیت توانایی و نقش ویژه خود را دارد؛ برای شنیدن توضیحات، صدای راهنما را روشن کنید.</div><div id="hand"><button class="unit active" data-kind="king">پادشاه</button><button class="unit" data-kind="die">تاس جنگی</button><button class="unit" data-kind="guard">سپر‌دار</button><button class="unit" data-kind="mage">جادوگر</button></div><div id="actions"><button id="roll">🎲 انداختن تاس</button><button id="voice">🔊 راهنمای صوتی: روشن</button><button id="reset">شروع دوباره</button></div><div id="hint">برای چرخش میدان انگشت را روی زمین بکشید؛ برای نزدیک‌شدن دو انگشت را باز کنید.</div></section><script src="./three-game.js"></script></body></html>
