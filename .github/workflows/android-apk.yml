name: Build Amirali Tunnel APK v2

on:
  push:
    paths:
      - 'games/amirali-tunnel/**'
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          test -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" || test -x "${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager"
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          echo "SDKMANAGER=${SDKMANAGER}" >> "$GITHUB_ENV"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true

      - name: Install Android platform
        run: |
          "${SDKMANAGER}" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare offline game asset
        run: |
          mkdir -p android/app/src/main/assets
          python3 - <<'PY'
          from pathlib import Path
          source = Path('games/amirali-tunnel/v2/index.html').read_text(encoding='utf-8')
          marker = '<!-- SAHROUD COUNTER'
          if marker in source:
              source = source.split(marker, 1)[0] + '</body></html>\\n'
          Path('android/app/src/main/assets/index.html').write_text(source, encoding='utf-8')
          PY

      - name: Build version 2 debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Verify APK package and integrity
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          unzip -t "$APK"
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 5
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" dist/Amirali-Tunnel-v2.apk
          echo "## APK v2 verification" >> "$GITHUB_STEP_SUMMARY"
          stat -c "File size: %s bytes" "$APK" >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$APK" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish version 2 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: amirali-tunnel-v2-offline-apk
          path: dist/Amirali-Tunnel-v2.apk
          if-no-files-found: error
          retention-days: 30
