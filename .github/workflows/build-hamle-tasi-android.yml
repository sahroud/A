name: Build Hamle Tasi Android APK

on:
  push:
    branches: [ali]
    paths:
      - 'games/hamle-tasi/**'
      - 'hamle-tasi-android/**'
      - '.github/workflows/build-hamle-tasi-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Copy original game unchanged
        run: |
          mkdir -p hamle-tasi-android/app/src/main/assets
          cp games/hamle-tasi/index.html hamle-tasi-android/app/src/main/assets/index.html
      - name: Build debug APK
        working-directory: hamle-tasi-android
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hamle-Tasi-Android-APK
          path: hamle-tasi-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
